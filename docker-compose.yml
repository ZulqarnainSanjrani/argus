services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://api:8000
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["8000:8000"]
    volumes:
      - ./apps/api/src:/app/apps/api/src

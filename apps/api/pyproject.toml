[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-api"
version = "0.1.0"
description = "ARGUS fixture-only Phase 1 API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/argus_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

name: API PostgreSQL validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus_ci
          POSTGRES_PASSWORD: argus_ci_test_only
          POSTGRES_DB: argus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus_ci -d argus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus_ci:argus_ci_test_only@localhost:5432/argus_ci
      ARGUS_TEST_DATABASE_URL: postgresql+psycopg://argus_ci:argus_ci_test_only@localhost:5432/argus_ci
      DOWNGRADE_DATABASE_URL: postgresql+psycopg://argus_ci:argus_ci_test_only@localhost:5432/argus_ci_downgrade
      PGPASSWORD: argus_ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: pip install -e 'apps/api[dev]'
      - name: Upgrade primary database
        run: alembic -c db/alembic.ini upgrade head
      - name: Run API tests against PostgreSQL
        run: pytest -q apps/api/tests
      - name: Validate isolated downgrade
        run: |
          psql -h localhost -U argus_ci -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE argus_ci_downgrade'
          ARGUS_DATABASE_URL="$DOWNGRADE_DATABASE_URL" alembic -c db/alembic.ini upgrade head
          ARGUS_DATABASE_URL="$DOWNGRADE_DATABASE_URL" alembic -c db/alembic.ini downgrade base
